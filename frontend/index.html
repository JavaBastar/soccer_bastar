<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer Bastar</title>
<script src="config.js"></script>

<style>
 body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: radial-gradient(circle at top, #0f172a, #0b0f19);
    color: #fff;
}

header {
    background: linear-gradient(90deg, #00c853, #00b0ff);
    padding: 18px;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: rgba(21, 27, 44, 0.85);
    border: 1px solid rgba(255,255,255,0.05);
    backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    transition: 0.25s ease;
}

.card:hover {
    transform: translateY(-3px);
    border-color: rgba(0, 200, 83, 0.4);
}

.hora {
    color: #00e676;
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.partido {
    font-size: 17px;
    margin: 8px 0 12px;
    font-weight: 600;
}

.canales {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.canal {
    display: inline-block;
    background: #1e293b;
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 12px;
    color: #93c5fd;
    text-decoration: none;
    transition: 0.2s;
    border: 1px solid transparent;
}

.canal:hover {
    background: #00c853;
    color: #000;
    transform: scale(1.05);
}

.badge {
    background: #00c853;
    color: #000;
    font-size: 10px;
    padding: 3px 7px;
    border-radius: 6px;
    margin-left: 6px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
}

.loader {
    text-align: center;
    margin-top: 60px;
    opacity: 0.7;
}
.header {
    background: linear-gradient(90deg, #00c853, #00b0ff, #00c853);
    background-size: 200% 200%;
    animation: gradientMove 6s ease infinite;
    padding: 18px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.status {
    font-size: 12px;
    margin-top: 6px;
    opacity: 0.9;
}
.card {
    position: relative;
    overflow: hidden;
}
.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,255,150,0.08), transparent);
    transition: 0.5s;
}

.card:hover::before {
    left: 100%;
}

.canal {
    position: relative;
    overflow: hidden;
}

.canal::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.15);
    transition: 0.3s;
}

.canal:hover::after {
    left: 100%;
}
.brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-weight: 800;
}

.logo {
    height: 38px;
    width: 38px;
    object-fit: contain;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    padding: 3px;
}

.fb-link {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    color: #ffffff;
    text-decoration: none;
    opacity: 0.85;
    transition: 0.2s;
}

.fb-link:hover {
    opacity: 1;
    color: #00e676;
}
.header {
    background: linear-gradient(90deg, #00c853, #00b0ff);
    padding: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

.header-container {
    max-width: 900px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 15px;
    
}

/* LOGO GRANDE IZQUIERDA */
.logo-big {
    height: 70px;
    width: 70px;
    object-fit: contain;
    background: rgba(255,255,255,0.1);
    padding: 6px;
    border-radius: 12px;
}

/* TEXTO DERECHA EN COLUMNA */
.header-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

/* TÍTULO */
.title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
}

/* STATUS */
.status {
    font-size: 12px;
    opacity: 0.9;
}

/* FACEBOOK */
.fb-link {
    font-size: 12px;
    color: white;
    text-decoration: none;
    opacity: 0.9;
    transition: 0.2s;
}

.fb-link:hover {
    opacity: 1;
    color: #000;
}
.header-container {
    max-width: 900px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 15px;
    justify-content: center;  /* 👈 AGREGA ESTO */
}

</style>
</head>

<body>


  <header class="header">
    <div class="header-container">

        <!-- LOGO IZQUIERDA -->
        <img src="logo ondo blanco.png" class="logo-big">

        <!-- TEXTO DERECHA -->
        <div class="header-info">
            <div class="title">SOCCER BASTAR LIVE</div>
            <div id="status" class="status">Conectando...</div>
            <a class="fb-link" href="https://www.facebook.com/AcademiaBastar" target="_blank">
                📘 Síguenos en Facebook
            </a>
        </div>

    </div>
</header>


  
    

<div class="container" id="app">
    <div class="loader">Cargando partidos...</div>
</div>

<script>

async function load() {
    const container = document.getElementById("app");

    try {
        const res = await fetch("https://raw.githubusercontent.com/JavaBastar/soccer_bastar/main/backend/partidos.json");
        const data = await res.json();

        console.log("DATA:", data);

        localStorage.setItem("partidos_cache", JSON.stringify(data));

        const now = new Date();

        const fecha = now.toLocaleDateString("es-MX", {
            day: "2-digit",
            month: "2-digit"
        });

        const hora = now.toLocaleTimeString("es-MX", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        });

        localStorage.setItem("last_update", `Actualizado ${fecha} - ${hora}`);



        if (data.length === 0) {
            const last = localStorage.getItem("last_update");

            if (last) {
                document.getElementById("status").innerText = `🟡 Sin partidos • ${last}`;
            } else {
                document.getElementById("status").innerText = "🟡 Sin partidos en este momento";
            }

            document.getElementById("status").style.color = "#ffd166";

        } else {
            document.getElementById("status").innerText = `🟢 ${data.length} partidos activos`;
            document.getElementById("status").style.color = "#00ff88";
            const last = localStorage.getItem("last_update");
            if (last) {
                document.getElementById("status").innerText += ` • ${last}`;
            }

        }


        render(data);

    } catch (e) {
        console.log("⚠️ API caída, usando cache local");

        const cache = localStorage.getItem("partidos_cache");

        if (cache) {
            const data = JSON.parse(cache);

            // 🔴 estado offline
            const last = localStorage.getItem("last_update");

            if (last) {
                document.getElementById("status").innerText = `🔴 Offline • ${last}`;
            } else {
                document.getElementById("status").innerText = "🔴 Offline (sin historial)";
            }
            document.getElementById("status").style.color = "#ff4d4d";

            render(data);
        } else {
            container.innerHTML = "<div class='loader'>❌ Sin datos disponibles</div>";
        }
    }
}

  function render(data) {
      let html = "";
  
      data.forEach(p => {
          html += `
          <div class="card">
              <div class="hora">
                  🕒 ${p.hora}
                  <span class="badge">LIVE</span>
              </div>
  
              <div class="partido">${p.partido}</div>
  
              <div class="canales">
                  ${p.canales.map(c => `
                      <a class="canal" href="${c.url}" target="_blank">
                          🔴 ${c.nombre}
                      </a>
                  `).join("")}
              </div>
          </div>
          `;
      });
  
      document.getElementById("app").innerHTML = html;
  }
  
  // 🚀 cargar al inicio
  load();
  
  </script>
  
</body>
</html>
